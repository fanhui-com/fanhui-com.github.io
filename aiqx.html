<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问答 - WMS系统</title>
<style>
  /* ====== 全局变量（WMS系统风格） ====== */
  :root {
    --wms-teal: #1a9b9b;
    --wms-teal-dark: #158686;
    --wms-teal-light: #e6f4f4;
    --bg: #f5f7fa;
    --primary: #1a9b9b;
    --primary-light: #e6f4f4;
    --success: #52c41a;
    --warning: #faad14;
    --danger: #f5222d;
    --text-primary: #262626;
    --text-secondary: #595959;
    --text-muted: #8c8c8c;
    --border: #d9d9d9;
    --border-light: #f0f0f0;
    --radius: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--text-primary);
  }

  /* ====== 顶部系统导航栏 ====== */
  .system-header {
    height: 50px;
    background: var(--wms-teal);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    color: #fff;
  }
  .system-logo {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .system-nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 13px;
  }
  .system-nav-right a {
    color: rgba(255,255,255,.85);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .system-nav-right a:hover { color: #fff; }

  /* ====== 二级导航栏 ====== */
  .sub-nav {
    height: 42px;
    background: #fff;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 4px;
    flex-shrink: 0;
  }
  .sub-nav a {
    padding: 0 14px;
    height: 42px;
    line-height: 42px;
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .sub-nav a:hover { color: var(--primary); }
  .sub-nav a.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 500;
  }

  /* ====== 面包屑 ====== */
  .breadcrumb {
    height: 36px;
    background: #fff;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .breadcrumb a { color: var(--text-muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--primary); }
  .breadcrumb .sep { margin: 0 6px; }
  .breadcrumb .current { color: var(--text-primary); }

  /* ====== 主内容区（标签页 + 对话） ====== */
  .main-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 标签页 */
  .tabs-bar {
    height: 46px;
    background: #fff;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 24px;
    flex-shrink: 0;
  }
  .tab-item {
    height: 46px;
    line-height: 46px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    position: relative;
  }
  .tab-item:hover { color: var(--primary); }
  .tab-item.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 500;
  }

  /* ====== 对话区 ====== */
  .chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    margin: 16px 20px 0;
    border-radius: var(--radius) var(--radius) 0 0;
    border: 1px solid var(--border-light);
    border-bottom: none;
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* 欢迎区 */
  .welcome-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px 40px;
    gap: 16px;
  }
  .welcome-avatar {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--wms-teal), #2db7b7);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(26,155,155,.25);
  }
  .welcome-text {
    font-size: 15px;
    color: var(--text-secondary);
  }
  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 640px;
    margin-top: 8px;
  }
  .chip {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 13px;
    background: #fafafa;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all .18s;
  }
  .chip:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* 消息行 */
  .msg-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: fadeUp .3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .avatar.ai {
    background: linear-gradient(135deg, var(--wms-teal), #2db7b7);
    color: #fff;
  }
  .avatar.admin { background: #1890ff; color: #fff; }
  .avatar.staff { background: #faad14; color: #fff; }

  .bubble-wrap { display: flex; flex-direction: column; gap: 4px; max-width: 72%; }
  .msg-row.user .bubble-wrap { align-items: flex-end; }

  .bubble-meta {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    box-shadow: var(--shadow);
    position: relative;
  }
  .bubble.ai-bubble {
    background: #fff;
    color: var(--text-primary);
    border: 1px solid var(--border-light);
    border-top-left-radius: 2px;
  }
  .bubble.user-bubble {
    background: var(--primary);
    color: #fff;
    border-top-right-radius: 2px;
  }

  /* AI特殊组件 */
  .thinking-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    padding: 6px 0 2px;
  }
  .thinking-dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 1.2s infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: .2s; }
  .thinking-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%,80%,100% { opacity: .3; transform: scale(1); }
    40% { opacity: 1; transform: scale(1.3); }
  }

  /* 角色推荐卡片 */
  .role-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .role-card {
    border: 1.5px solid var(--border-light);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all .2s;
    background: #fafafa;
  }
  .role-card:hover { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,155,155,.08); }
  .role-card.selected { border-color: var(--primary); background: var(--primary-light); }

  .role-medal { font-size: 20px; width: 28px; text-align: center; }
  .role-info { flex: 1; }
  .role-name { font-size: 14px; font-weight: 600; }
  .role-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .role-reason {
    font-size: 11px;
    background: #f6ffed;
    color: #389e0d;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 4px;
    display: inline-block;
  }
  .role-score {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  /* 权限列表 */
  .perm-list {
    margin-top: 10px;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    overflow: hidden;
  }
  .perm-module {
    padding: 8px 14px;
    background: #fafafa;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .perm-items { padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .perm-tag {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    background: #e6f7ff;
    color: #096dd9;
    border: 1px solid #bae0ff;
  }
  .perm-tag.readonly { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }

  /* 确认区 */
  .confirm-bar {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    font-weight: 500;
    transition: all .18s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--wms-teal-dark); }
  .btn-ghost { background: #f5f5f5; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #e8e8e8; }
  .btn-danger { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
  .btn-danger:hover { background: #ffe6e4; }

  /* 状态提示 */
  .status-msg {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 8px;
  }
  .status-msg.success { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
  .status-msg.warning { background: #fffbe6; border: 1px solid #ffe58f; color: #d48806; }
  .status-msg.info    { background: #e6f7ff; border: 1px solid #bae0ff; color: #096dd9; }
  .status-msg.error   { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
  .status-icon { font-size: 16px; flex-shrink: 0; }

  /* 候选菜单 */
  .menu-candidates {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .menu-candidate-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    cursor: pointer;
    background: #fafafa;
    transition: all .18s;
    font-size: 13px;
  }
  .menu-candidate-item:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

  /* 批量预览表格 */
  .batch-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }
  .batch-table th {
    background: #fafafa;
    padding: 7px 12px;
    text-align: left;
    font-size: 12px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-light);
    font-weight: 600;
  }
  .batch-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text-primary);
  }
  .batch-table tr:last-child td { border-bottom: none; }
  .batch-table tr:hover td { background: #fafafa; }

  /* 邮件预览 */
  .email-preview {
    border: 1px solid var(--border-light);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 10px;
    font-size: 13px;
  }
  .email-header {
    background: #fafafa;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .email-meta { color: var(--text-secondary); font-size: 12px; }
  .email-subject { font-weight: 600; }
  .email-body { padding: 12px 14px; line-height: 1.8; }

  /* 临时授权 */
  .temp-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: #fff7e6;
    border: 1px solid #ffd591;
    border-radius: 4px;
    font-size: 11px;
    color: #d48806;
  }

  /* ====== 输入区 ====== */
  .input-area {
    padding: 14px 20px 18px;
    background: #fff;
    border-top: 1px solid var(--border-light);
    flex-shrink: 0;
  }
  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: #f5f7fa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-wrap:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(26,155,155,.1);
  }
  .input-box {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 100px;
    line-height: 1.6;
    font-family: inherit;
    color: var(--text-primary);
  }
  .input-box::placeholder { color: #bfbfbf; }
  .input-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .icon-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    color: var(--text-muted);
    transition: all .18s;
  }
  .icon-btn:hover { background: #e8e8e8; color: var(--text-primary); }
  .send-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: none;
    background: var(--primary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: #fff;
    transition: all .18s;
  }
  .send-btn:hover { background: var(--wms-teal-dark); }
  .send-btn:disabled { background: #bfbfbf; cursor: not-allowed; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 4px; }

  /* 高亮关键词 */
  .hl { color: var(--primary); font-weight: 600; }
  .hl-user { color: #1890ff; font-weight: 600; }
  .hl-perm { color: #722ed1; font-weight: 600; }
  .hl-warn { color: #d48806; font-weight: 600; }

  /* 标签行 */
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag {
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .tag-blue { background: #e6f7ff; color: #096dd9; border: 1px solid #bae0ff; }
  .tag-green { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
  .tag-purple { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
  .tag-orange { background: #fff7e6; color: #d48806; border: 1px solid #ffd591; }

  /* 右侧工具栏 */
  .right-tools {
    position: fixed;
    right: 12px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  .tool-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: all .2s;
  }
  .tool-btn:hover { background: var(--primary-light); border-color: var(--primary); }
</style>
</head>
<body>

<!-- 系统顶部栏 -->
<div class="system-header">
  <div class="system-logo">WMS仓储管理系统</div>
  <div class="system-nav-right">
    <a href="#"><span>📋</span> WMS需求池</a>
    <a href="#"><span>📱</span> PDA端下载</a>
  </div>
</div>

<!-- 二级导航 -->
<div class="sub-nav">
  <a href="#">主页</a>
  <a href="#">盘点管理</a>
  <a href="#">入库任务</a>
  <a href="#">角色管理</a>
  <a href="#">角色资源管理</a>
  <a href="#">用户管理</a>
  <a href="#">实时库存查询</a>
  <a href="#" class="active">权限助手</a>
</div>

<!-- 面包屑 -->
<div class="breadcrumb">
  <a href="#">报表管理</a>
  <span class="sep">/</span>
  <span class="current">权限助手</span>
</div>

<!-- 主内容 -->
<div class="main-wrap">
  <!-- 标签页 -->
  <div class="tabs-bar">
    <div class="tab-item active" onclick="switchTab(this, 'chat')">权限助手</div>
    <div class="tab-item" onclick="switchTab(this, 'qa-lib')">角色库</div>
    <div class="tab-item" onclick="switchTab(this, 'qa-history')">授权记录</div>
  </div>

  <!-- 对话区 -->
  <div class="chat-wrap" id="chatPanel">
    <div class="chat-area" id="chatArea">
      <!-- 欢迎 -->
      <div class="welcome-block" id="welcome">
        <div class="welcome-avatar">🤖</div>
        <div class="welcome-text">你好，有什么可以帮您</div>
        <div class="quick-chips">
          <div class="chip" onclick="sendQuick('给张三开通库存盘点菜单权限')">🔑 给张三开通库存盘点权限</div>
          <div class="chip" onclick="sendQuick('张三现在有什么权限？')">📋 查询张三的权限</div>
          <div class="chip" onclick="sendQuick('给仓库部所有人开通库存盘点权限')">👥 批量授权仓库部</div>
          <div class="chip" onclick="sendQuick('给张三开通盘点权限，3天后自动收回')">⏰ 临时授权3天</div>
          <div class="chip" onclick="sendQuick('把张三的库存盘点权限收回')">🗑️ 撤销张三的权限</div>
          <div class="chip" onclick="sendQuick('帮我开通库存盘点权限')">📧 申请权限（非管理员）</div>
          <div class="chip" onclick="sendQuick('给张三开通报表导出权限')">🆕 菜单无角色授权</div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea class="input-box" id="inputBox" rows="1"
          placeholder="请输入您的问题，例如：给张三开通库存盘点菜单权限…"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>
        <div class="input-actions">
          <button class="icon-btn" title="上传附件">📎</button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 右侧工具 -->
<div class="right-tools">
  <div class="tool-btn" title="清空对话" onclick="clearChat()">🗑️</div>
  <div class="tool-btn" title="切换身份" onclick="toggleIdentity()">👤</div>
  <div class="tool-btn" title="场景示例" onclick="showScenarios()">⚡</div>
</div>

<script>
// ====== 状态 ======
let isAdmin = true;
let currentTab = 'chat';
let isTyping = false;

// ====== 场景数据 ======
const SCENARIOS = [
  // 0: 单人授权
  [
    { role: 'user', text: '给张三开通库存盘点菜单权限' },
    { role: 'ai', type: 'role_recommend', user: '张三', menu: '库存盘点' }
  ],
  // 1: 批量授权
  [
    { role: 'user', text: '给仓库部所有人开通库存盘点权限' },
    { role: 'ai', type: 'batch_authorize', dept: '仓库部', menu: '库存盘点' }
  ],
  // 2: 权限冲突
  [
    { role: 'user', text: '给李四开通库存盘点权限' },
    { role: 'ai', type: 'conflict', user: '李四', menu: '库存盘点' }
  ],

// ====== 工具函数 ======
function getTime() {
  const now = new Date();
  return now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function scrollBottom() {
  const area = document.getElementById('chatArea');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 100);
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.style.display = 'none';
}

// ====== 标签切换 ======
function switchTab(el, tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = tab;
  if (tab === 'chat') {
    document.getElementById('chatPanel').style.display = 'flex';
  } else {
    // 其他标签占位
    document.getElementById('chatArea').innerHTML = `
      <div style="text-align:center;padding:80px 20px;color:var(--text-muted);">
        <div style="font-size:48px;margin-bottom:16px;">📋</div>
        <div style="font-size:15px;">${tab === 'qa-lib' ? '角色库' : '授权记录'} 功能开发中…</div>
      </div>`;
  }
}

// ====== 添加消息气泡 ======
function addUserBubble(text) {
  hideWelcome();
  const area = document.getElementById('chatArea');
  const who = isAdmin ? '范会' : '张三';
  const cls = isAdmin ? 'admin' : 'staff';
  const icon = isAdmin ? '👤' : '🙋';
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="avatar ${cls}">${icon}</div>
    <div class="bubble-wrap">
      <div class="bubble-meta">${who} · ${getTime()}</div>
      <div class="bubble user-bubble">${text}</div>
    </div>`;
  area.appendChild(row);
  scrollBottom();
}

function addThinking() {
  hideWelcome();
  const area = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.id = 'thinking-row';
  row.innerHTML = `
    <div class="avatar ai">🤖</div>

function addFollowup(text) {

}

// ====== 场景演示 ======
function showScenarios() {
  const idx = prompt('输入场景编号（0-10）:\n0-单人开通 1-批量授权 2-权限冲突 3-临时授权 4-模糊输入 5-查询权限 6-撤销权限 7-非管理员申请 8-菜单无角色(新建/选择) 9-角色名补全(匹配) 10-角色名补全(新建)');
  if (idx !== null && idx >= '0' && idx <= '10') loadScenario(parseInt(idx));
}

function loadScenario(idx) {
  const area = document.getElementById('chatArea');
  area.innerHTML = `
    <div class="welcome-block" id="welcome" style="display:none;"></div>`;

  const scene = SCENARIOS[idx];
  let delay = 0;

  // 切换身份
  if (scene[0].identity === 'staff') {
    isAdmin = false;
  } else {
    isAdmin = true;
  }

  scene.forEach((msg) => {
    delay += 300;
    setTimeout(() => {
      if (msg.role === 'user') {
        addUserBubble(msg.text);
      } else {
        const thinkRow = addThinking();
        setTimeout(() => {
          removeThinking();
          renderAIMsg(msg);
        }, 900);
      }
    }, delay);
    delay += 1200;
  });
}

function renderAIMsg(msg) {
  let html = '';
  switch (msg.type) {
    case 'role_recommend': html = genRoleRecommend(msg.user, msg.menu); break;
    case 'batch_authorize': html = genBatchAuth(msg.dept, msg.menu); break;
    case 'conflict': html = genConflict(msg.user, msg.menu); break;
    case 'temp_auth': html = genTempAuth(msg.user, msg.menu, msg.days); break;
    case 'fuzzy': html = genFuzzy(msg.user, msg.keyword); break;
    case 'query_perm': html = genQueryPerm(msg.user); break;
    case 'revoke': html = genRevoke(msg.user, msg.menu); break;
    case 'non_admin_apply': html = genNonAdminApply(msg.menu); break;
    case 'no_role': html = genNoRole(msg.user, msg.menu); break;
    case 'role_autocomplete': html = genRoleAutocomplete(msg.user, msg.menu, msg.input, msg.matched, msg.isNew); break;
    default: html = `<p>${msg.text || '（功能演示）'}</p>`;
  }
  addAIBubble(html);
}

function simulateAIReply(type, user, menu, text) {
  const thinkRow = addThinking();
  setTimeout(() => {
    removeThinking();
    if (type === 'text') {
      addAIBubble(`<p>${text}</p>`);
    } else {
      renderAIMsg({ type, user, menu });
    }
  }, 900);
}

// ====== 发送消息 ======
function sendMessage() {
  const box = document.getElementById('inputBox');
  const text = box.value.trim();
  if (!text || isTyping) return;

  box.value = '';
  box.style.height = 'auto';
  addUserBubble(text);
  isTyping = true;

  const thinkRow = addThinking();
  setTimeout(() => {
    removeThinking();
    isTyping = false;
    const t = text.toLowerCase();
    let type = 'role_recommend', user = '张三', menu = '库存盘点';
    if (t.includes('批量') || t.includes('部门')) { type = 'batch_authorize'; }
    else if (t.includes('已有') || t.includes('李四')) { type = 'conflict'; user = '李四'; }
    else if (t.includes('天后') || t.includes('临时')) { type = 'temp_auth'; }
    else if (t.includes('什么权限') || t.includes('有哪些')) { type = 'query_perm'; }
    else if (t.includes('收回') || t.includes('撤销')) { type = 'revoke'; }
    else if (!isAdmin) { type = 'non_admin_apply'; }
    else if (t.includes('报表导出') || t.includes('导出报表') || (t.includes('开通') && (t.includes('导出') || t.includes('报表')))) { type = 'no_role'; user = '张三'; menu = '报表导出'; }
    else if (t.replace(/[\u4e00-\u9fa5]/g, '').length < 3 && t.includes('库存')) { type = 'fuzzy'; }

    renderAIMsg({ type, user, menu, days: 3, dept: '仓库部', keyword: '库存' });
  }, 1000);
}

function sendQuick(text) {
  document.getElementById('inputBox').value = text;
  sendMessage();
}
