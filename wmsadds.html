<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wms范会产品设计稿访问地址对照表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif; }
    body { background: #f5f7fa; font-size: 14px; color: #333; }
    .header { background: linear-gradient(90deg, #43989c 0%, #3a888c 100%); height: 60px; line-height: 60px; padding: 0 24px; color: #fff; display: flex; align-items: center; }
    .logo { font-size: 18px; font-weight: 600; }
    .content { padding: 24px; max-width: 1920px; margin: 0 auto; }
    .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .addBtn { background: #43989c; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    .table-container { background: #fff; border-radius: 8px; border: 1px solid #e8e8e8; overflow: hidden; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .data-table th { background: #f8f9fa; }
    .link-btn { color: #43989c; text-decoration: none; }
    input, select { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; }
    .btn { padding: 4px 10px; border-radius: 3px; border: none; cursor: pointer; margin: 0 3px; }
    .btn-save { background: #43989c; color: #fff; }
    .btn-cancel { background: #999; color: #fff; }
    .btn-del { background: #f56c6c; color: #fff; }
  </style>
</head>
<body>
<div class="header"><div class="logo">格力WMS系统 - 设计稿地址管理</div></div>
<div class="content">
  <div class="content-header">
    <div class="content-title">wms范会产品设计稿访问地址对照表</div>
    <button class="addBtn" onclick="addOneRow()">➕ 新增一行</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>设计稿名称</th><th>版本号</th><th>终端类型</th><th>访问链接</th><th>备注</th><th>操作</th></tr></thead>
      <tbody id="tableBody">
        <tr><td>盘点分析pc看板</td><td>V1.0</td><td>PC</td><td><a href="https://huilog.qzz.io/wmspc03" class="link-btn">打开</a></td><td><a href="https://ztpm.gree.com:8888/story-view-63744.html" class="link-btn">禅道63744</a></td><td><button class="btn btn-del" onclick="delRow(this)">删除</button></td></tr>
        <tr><td>库存看板</td><td>V1.0</td><td>PC</td><td><a href="https://huilog.qzz.io/WMS1" class="link-btn">打开</a></td><td><a href="无" class="link-btn">无</a></td><td><button class="btn btn-del" onclick="delRow(this)">删除</button></td></tr>
        <tr><td>装卸工时确认pda</td><td>V1.0</td><td>PDA</td><td><a href="https://huilog.qzz.io/wmspda3" class="link-btn">打开</a></td><td><a href="https://ztpm.gree.com:8888/story-view-63740.html" class="link-btn">禅道63740</a></td><td><button class="btn btn-del" onclick="delRow(this)">删除</button></td></tr>
        <tr><td>PDA运单绑定</td><td>V1.0</td><td>PDA</td><td><a href="https://huilog.qzz.io/my-warehousehtml-page/PDAyundanbangdi.html" target="_blank" class="link-btn">打开</a></td><td><a href="https://ztpm.gree.com:8888/story-view-62810.html" class="link-btn">禅道62810</a></td><td><button class="btn btn-del" onclick="delRow(this)">删除</button></td></tr>
       <tr><td>运营参数配置日志</td><td>V1.0</td><td>PC</td><td><a href="https://huilog.qzz.io/wmslog " target="_blank" class="link-btn">打开</a></td><td><a href="https://ztpm.gree.com:8888/story-view-63926.html" class="link-btn">禅道63926</a></td><td><button class="btn btn-del" onclick="delRow(this)">删除</button></td></tr>
    </tbody>
    </table>
  </div>
</div>
<script>
  function addOneRow() {
    let tbody = document.getElementById("tableBody");
    let tr = document.createElement("tr");
    tr.innerHTML = `<td><input placeholder="设计稿名称"></td><td><input value="V1.0"></td><td><select><option>PC</option><option>PDA</option></select></td><td><input placeholder="链接"></td><td><input placeholder="备注"></td><td><button class="btn btn-save" onclick="saveRow(this)">保存</button><button class="btn btn-cancel" onclick="cancelRow(this)">取消</button></td>`;
    tbody.appendChild(tr);
  }
  function saveRow(btn) {
    let tr = btn.parentElement.parentElement;
    let inputs = tr.querySelectorAll("input, select");
    let name = inputs[0].value, ver = inputs[1].value, type = inputs[2].value, url = inputs[3].value, remark = inputs[4].value;
    tr.innerHTML = `<td>${name}</td><td>${ver}</td><td>${type}</td><td><a href="${url}" target="_blank" class="link-btn">打开</a></td><td>${remark}</td><td><button class="btn btn-del" onclick="delRow(this)">删除</button></td>`;
  }
  function cancelRow(btn) { btn.parentElement.parentElement.remove(); }
  function delRow(btn) { if(confirm("确定删除？")) btn.parentElement.parentElement.remove(); }
</script>
</body>
</html>
